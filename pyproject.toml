[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tactkx-tool_call_arg_mismatch_grouping"
version = "0.1.0"
description = "按结构键把条目聚类，标出语音合成工程师·工具调用的参数错配上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tactkx" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tactkx.github.io"
Repository = "https://github.com/tactkx/tool_call_arg_mismatch_grouping"
Issues = "https://github.com/tactkx/tool_call_arg_mismatch_grouping/issues"

[project.scripts]
tool_call_arg_mismatch_grouping = "tool_call_arg_mismatch_grouping:main"

[tool.setuptools]
py-modules = ["tool_call_arg_mismatch_grouping"]
